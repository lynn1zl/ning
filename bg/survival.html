<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Myeongjo:wght@700;800&family=Nanum+Gothic+Coding:wght@400;700&display=swap');

  :root {
    --rust: #b5532a;
    --blood: #c8312b;
    --hazard: #d9a21b;
    --ash: #d3dde5;
    --sans: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    --stencil: 'Black Han Sans', var(--sans);
    --serif: 'Nanum Myeongjo', 'Noto Serif KR', serif;
    --mono: 'Nanum Gothic Coding', 'D2Coding', monospace;
  }

  body {
    background:
      radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1.4px) 0 0 / 5px 5px,
      linear-gradient(170deg, #1a2430 0%, #0b1118 100%);
  }

  .scene {
    position: absolute;
    inset: 40px;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 70% 32%, rgba(240,244,246,0.7) 0 40px, transparent 220px),
      linear-gradient(180deg, transparent 63%, #b6c1c8 63%, #c3ccd2 78%, #ccd4d9 100%),
      linear-gradient(180deg, #b3c0ca 0%, #c8d2d9 30%, #dbe2e6 55%, #d4dce1 63%);
    clip-path: polygon(
      0 3%, 4% 0, 9% 1.5%, 14% 0, 22% 0.8%, 27% 0, 35% 2%, 41% 0, 50% 1%, 57% 0, 63% 2.5%, 70% 0.5%, 78% 0, 84% 1.8%, 91% 0, 96% 1.2%, 100% 0,
      99% 7%, 100% 14%, 98.5% 22%, 100% 30%, 99% 41%, 100% 50%, 98% 58%, 100% 66%, 99.2% 75%, 100% 84%, 98.6% 92%, 100% 100%,
      93% 98.5%, 87% 100%, 80% 98%, 72% 100%, 65% 98.8%, 58% 100%, 50% 97.5%, 43% 100%, 36% 98.6%, 28% 100%, 21% 98%, 13% 100%, 7% 98.5%, 0 100%,
      1.2% 92%, 0 84%, 1.6% 75%, 0 66%, 0.8% 57%, 0 47%, 1.5% 38%, 0 29%, 1% 20%, 0 11%);
  }
  .scene > div { position: absolute; }

  .smoke {
    width: 150px; height: 360px;
    background:
      radial-gradient(ellipse at 50% 85%, rgba(90,102,112,0.32), transparent 45%),
      radial-gradient(ellipse at 45% 60%, rgba(105,116,126,0.24), transparent 45%),
      radial-gradient(ellipse at 60% 35%, rgba(100,112,122,0.26), transparent 50%),
      radial-gradient(ellipse at 35% 12%, rgba(115,126,136,0.16), transparent 55%);
    filter: blur(6px);
  }
  .scene .sm1 { left: 14%; top: 5%; transform: rotate(-12deg); }
  .scene .sm2 { right: 9%; top: 0; width: 200px; transform: rotate(-18deg); opacity: 0.8; }

  .scene .far {
    left: 0; right: 0; top: 34%; height: 30%;

  }
