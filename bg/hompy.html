<!-- ninining-safe: 25.5% 18.4% 42.4% 10%; min-height: 100% -->
<!-- 미니홈피: 프레임 색 · 배경 색 · 마이룸 · TALK! TALK! 은 텍스트 탭에서 바꿔요 -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Silkscreen:wght@400;700&display=swap');

  :root {
    --frame: {{프레임색}};
    --bg: {{배경색}};
    --deep: color-mix(in srgb, var(--frame) 52%, #1f2b38);
    --line: color-mix(in srgb, var(--frame) 62%, #44505c);
    --tint: color-mix(in srgb, var(--frame) 34%, #ffffff);
    --pale: color-mix(in srgb, var(--frame) 14%, #ffffff);
    --ko: 'Gowun Dodum', 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    --px: 'Silkscreen', 'Gowun Dodum', monospace;
  }

  body {
    background:
      radial-gradient(circle, color-mix(in srgb, var(--bg) 82%, #000) 1.1px, transparent 1.6px) 0 0 / 18px 18px,
      var(--bg);
  }

  /* 카드 폭에 맞춰 모든 치수가 함께 커지고 작아지도록 (600px 기준 1u) */
  .hp { position: absolute; inset: 0; container-type: size; }
  .hp * { --u: calc(100cqw / 600); }
  .hp > div { position: absolute; }

  /* 바깥 프레임 + 물방울 무늬 */
  .frame {
    inset: calc(16 * var(--u));
    border-radius: calc(26 * var(--u));
    background:
      radial-gradient(circle, rgba(255,255,255,.42) calc(4.2 * var(--u)), transparent calc(4.8 * var(--u))) calc(6 * var(--u)) calc(4 * var(--u)) / calc(34 * var(--u)) calc(34 * var(--u)),
      var(--frame);
    box-shadow: inset 0 0 0 calc(1.5 * var(--u)) var(--line), 0 calc(4 * var(--u)) 0 rgba(0,0,0,.07);
  }
  .bar {
    top: calc(27 * var(--u)); left: calc(42 * var(--u)); right: calc(92 * var(--u));
    display: flex; justify-content: space-between; align-items: center;
    font: 700 calc(9.5 * var(--u))/1 var(--px);
    letter-spacing: .06em;
    color: var(--deep);
  }
  .bar .heart { color: #ff6b8a; margin-right: calc(4 * var(--u)); }
  .bar .count b { font-weight: 700; color: #f04f72; margin: 0 calc(3 * var(--u)); }
  .bar .count i { font-style: normal; opacity: .7; margin: 0 calc(5 * var(--u)); }

  /* 종이 두 장 */
  .paper {
    background: #fff;
    border: calc(1.5 * var(--u)) solid var(--line);
    border-radius: calc(16 * var(--u));
    box-shadow: 0 calc(3 * var(--u)) 0 rgba(0,0,0,.08);
  }
  .top { top: calc(48 * var(--u)); left: calc(34 * var(--u)); right: calc(84 * var(--u)); bottom: calc(232 * var(--u)); }
  .bottom { left: calc(34 * var(--u)); right: calc(84 * var(--u)); bottom: calc(34 * var(--u)); height: calc(178 * var(--u)); }

  /* 메뉴 탭 */
  .tabs {
    top: calc(92 * var(--u)); right: calc(24 * var(--u)); width: calc(62 * var(--u));
    display: flex; flex-direction: column; gap: calc(6 * var(--u));
  }
  .tabs span {
    display: block;
    height: calc(30 * var(--u));
    padding-left: calc(4 * var(--u));
    font: calc(11 * var(--u))/calc(28 * var(--u)) var(--ko);
    text-align: center;
    margin-left: calc(2 * var(--u));
    letter-spacing: -.02em;
    color: var(--deep);
    background: var(--tint);
    border: calc(1.5 * var(--u)) solid var(--line);
    border-left: 0;
    border-radius: 0 calc(9 * var(--u)) calc(9 * var(--u)) 0;
    box-shadow: 0 calc(2 * var(--u)) 0 rgba(0,0,0,.07);
  }
  .tabs span.on { background: #fff; color: #222b33; font-weight: 700; margin-left: calc(-5 * var(--u)); padding-left: calc(11 * var(--u)); }

  /* 머리글: 제목 + 바로 밑에 출처 */
  .head {
    top: calc(72 * var(--u)); left: calc(60 * var(--u)); right: calc(110 * var(--u));
    padding-bottom: calc(13 * var(--u));
    border-bottom: calc(1.2 * var(--u)) dashed var(--tint);
  }
  .head h1 {
    margin: 0;
    font: calc(21 * var(--u))/1.3 var(--ko);
    letter-spacing: -.03em;
    color: var(--deep);
    word-break: keep-all;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .head h1::after { content: ' ♪'; font-size: .7em; color: #ff8fa6; }
  .head .src { margin-top: calc(4 * var(--u)); font: calc(10.5 * var(--u))/1.3 var(--ko); color: #8c949c; }
  .head .src b, .head .src i { font: inherit; }
  .head .src b:empty, .head .src i:empty { display: none; }
  .head .src b:not(:empty) ~ i:not(:empty)::before { content: ' · '; }

  /* 고리 */
  .ring {
    bottom: calc(198 * var(--u));
    width: calc(11 * var(--u)); height: calc(48 * var(--u));
    border-radius: calc(6 * var(--u));
    background: linear-gradient(90deg, #a9b1b8, #f4f6f8 45%, #c2c8ce 70%, #8e979f);
    box-shadow: 0 0 0 calc(1 * var(--u)) rgba(60,70,80,.35);
  }
  .r1 { left: calc(92 * var(--u)); } .r2 { left: calc(116 * var(--u)); }
  .r3 { left: calc(408 * var(--u)); } .r4 { left: calc(432 * var(--u)); }

  /* 아래 2열 */
  .cols {
    left: calc(50 * var(--u)); right: calc(100 * var(--u)); bottom: calc(50 * var(--u)); height: calc(146 * var(--u));
    display: grid; grid-template-columns: 45% 1fr; column-gap: calc(18 * var(--u));
  }
  .lab {
    display: flex; align-items: baseline; gap: calc(6 * var(--u));
    margin-bottom: calc(7 * var(--u));
    font: 700 calc(10 * var(--u))/1 var(--px);
    letter-spacing: .04em;
    color: var(--deep);
  }
  .lab small { font: calc(8.5 * var(--u))/1 var(--ko); color: #9aa1a8; letter-spacing: 0; }
  .lab .h { margin-left: auto; color: #ff8fa6; font-size: calc(9 * var(--u)); }

  .room {
    position: relative;
    height: calc(128 * var(--u));
    overflow: hidden;
    border: calc(1 * var(--u)) solid var(--line);
    border-radius: calc(6 * var(--u));
    background: linear-gradient(90deg, #fbfbfb 50%, #ededee 50%);
  }
  .room::before {             /* 바닥 */
    content: '';
    position: absolute; inset: 0;
    clip-path: polygon(0 82%, 50% 46%, 100% 82%, 100% 100%, 0 100%);
    background:
      radial-gradient(circle, #fff calc(1.2 * var(--u)), transparent calc(1.7 * var(--u))) 0 0 / calc(16 * var(--u)) calc(11 * var(--u)),
      var(--tint);
  }
  .room::after {              /* 벽 모서리 */
    content: '';
    position: absolute; left: 50%; top: 0; height: 46%;
    border-left: calc(1 * var(--u)) solid #b9bec3;
  }
  .room .heart {
    position: absolute; left: 50%; top: 58%; z-index: 1;
    transform: translate(-50%, -50%);
    font-size: calc(18 * var(--u)); color: #ff8fa6;
  }
  .room img { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; object-fit: cover; }
  .room .say {
    position: absolute; left: 50%; top: calc(12 * var(--u)); z-index: 3;
    transform: translateX(-50%);
    max-width: 82%;
    padding: calc(4 * var(--u)) calc(9 * var(--u));
    font: calc(10 * var(--u))/1.35 var(--ko);
    color: #222;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: #fff;
    border: calc(1 * var(--u)) solid #6f7780;
    border-radius: calc(3 * var(--u));
  }

  .talk { border-left: calc(1 * var(--u)) dotted var(--tint); padding-left: calc(16 * var(--u)); min-width: 0; }
  .talk ul { list-style: none; margin: 0; padding: 0; }
  .talk li {
    display: flex; align-items: baseline; gap: calc(6 * var(--u));
    padding: calc(5.5 * var(--u)) 0 calc(4.5 * var(--u));
    border-bottom: calc(1 * var(--u)) dotted #d4d8dc;
    font: calc(10.5 * var(--u))/1.3 var(--ko);
    color: #333b42;
  }
  .talk li::before { content: '·'; color: var(--deep); font-weight: 700; }
  .talk li span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .talk li em { font-style: normal; font-size: calc(9 * var(--u)); color: #9aa1a8; white-space: nowrap; }
  .talk ul:empty::after { content: '아직 남긴 한마디가 없어요'; display: block; padding-top: calc(8 * var(--u)); font: calc(10 * var(--u))/1.4 var(--ko); color: #b0b6bb; }
</style>

<div class="hp">
  <div class="frame"></div>
  <div class="bar"><span><span class="heart">♥</span>MINIHOMPY</span><span class="count">TODAY<b>{{투데이}}</b><i>|</i>TOTAL<b>{{토탈}}</b></span></div>
  <div class="paper top"></div>
  <div class="paper bottom"></div>
  <div class="tabs"><span class="on">홈</span><span>프로필</span><span>앨범</span><span>다이어리</span><span>방명록</span></div>
  <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
  <div class="head"><h1>{{제목}}</h1><div class="src"><b>{{출처}}</b><i>{{제작자}}</i></div></div>
  <div class="cols">
    <div class="mini">
      <div class="lab">Miniroom<span class="h">♥</span></div>
      <div class="room"><span class="heart">♥</span>{{마이룸}}</div>
    </div>
    <div class="talk">
      <div class="lab">TALK! TALK!<small>한마디 남기기</small></div>
      <ul>{{톡톡}}</ul>
    </div>
  </div>
</div>
